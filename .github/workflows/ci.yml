name: CI

on:
  push:
    branches: [main, sandbox]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .dev.vars.example .dev.vars
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: IMDb loader tests
        run: python3 -m unittest discover -s tools/imdb -v
      - name: Build
        run: npm run build
      - name: Local database
        run: npm run db:migrate:local
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      # The service worker exists only in production builds, so installing and the update flow
      # (#4, which rebuilds mid-test) run against the built Worker under `wrangler dev`.
      - name: Install and update against the built Worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --port 4173 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:4173/version && break; sleep 1; done
          E2E_BASE_URL=http://localhost:4173 npx playwright test e2e/install.test.ts e2e/speed.test.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
