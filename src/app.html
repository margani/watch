<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- One colour, set below and by syncThemeColor: the installed app paints its window buttons
		     with it, so it follows the app's theme, not the system's. -->
		<meta name="theme-color" content="#f7f5f1" />
		<meta name="apple-mobile-web-app-title" content="Watch" />
		<script nonce="%sveltekit.nonce%">
			// Set the theme before first paint so dark mode does not flash white.
			try {
				const t = localStorage.getItem('theme');
				const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? '#131210' : '#f7f5f1');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
