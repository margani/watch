<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- One colour, set below and by applyTheme: the installed app paints its window buttons
		     with it, so it follows the app's theme, not the system's. -->
		<meta name="theme-color" content="#f5f1e8" />
		<meta name="apple-mobile-web-app-title" content="Watch" />
		<script nonce="%sveltekit.nonce%">
			// The theme before first paint, so a dark or coloured theme does not flash Paper.
			// Mirrors readChoice/resolveTheme/applyTheme in src/lib/themes.ts (a unit test keeps them in step).
			try {
				const s = localStorage.getItem('theme');
				const c = s === 'light' ? 'paper' : s === 'dark' ? 'ink' : s;
				const dark = matchMedia('(prefers-color-scheme: dark)').matches;
				const t = ['paper', 'ink', 'sage', 'plum'].includes(c) ? c : dark ? 'ink' : 'paper';
				const bg = { paper: '#f5f1e8', ink: '#16130f', sage: '#eef2ea', plum: '#f4eff6' };
				document.documentElement.dataset.theme = t;
				document.documentElement.classList.toggle('dark', t === 'ink');
				document.querySelector('meta[name="theme-color"]').setAttribute('content', bg[t]);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
